name: Change record

# Requires a pull request that changes code/** to add or amend a record under
# manual/changes/, unless it has the `no change record` label. This is a separate
# workflow so that changing the label re-runs it without the Windows build.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - labeled
      - unlabeled
    paths:
      - "code/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: change-record-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  record:
    name: Require a change record
    # A draft pull request runs no checks; the ready_for_review trigger above
    # starts this one when the pull request is marked ready.
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Look for a change record on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.pull_request.number }}
          WAIVED: ${{ contains(github.event.pull_request.labels.*.name, 'no change record') }}
          CONTRIBUTING: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.event.pull_request.base.ref }}/CONTRIBUTING.md#validation
        shell: bash
        run: |
          set -euo pipefail

          if [ "${WAIVED}" = "true" ]; then
            echo "Waived by the 'no change record' label."
            exit 0
          fi

          # The file list covers the whole pull request, so a record added or
          # amended by any of its commits counts.
          files="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${NUMBER}/files" \
            --paginate --jq '.[] | select(.status != "removed") | .filename')"

          records="$(printf '%s\n' "${files}" | grep -E '^manual/changes/[^/]+\.md$' || true)"
          if [ -n "${records}" ]; then
            echo "Change records in this pull request:"
            printf '%s\n' "${records}" | sed 's/^/  /'
            exit 0
          fi

          sources="$(printf '%s\n' "${files}" | grep -E '^code/' || true)"
          count="$(printf '%s\n' "${sources}" | grep -c . || true)"
          {
            echo "### Missing change record"
            echo
            echo "This pull request changes ${count} engine source file(s) and adds no record under \`manual/changes/\`:"
            echo
            echo '```'
            printf '%s\n' "${sources}" | head -n 20
            if [ "${count}" -gt 20 ]; then
              echo "... and $(( count - 20 )) more"
            fi
            echo '```'
            echo
            echo "Write the record for what players and modders will see, or apply the"
            echo "\`no change record\` label when the change alters no visible behavior."
            echo "[Contributing](${CONTRIBUTING}) describes both."
          } >> "${GITHUB_STEP_SUMMARY}"
          echo "::error::Engine source changed with no record under manual/changes/. Add one, or apply the 'no change record' label."
          exit 1
