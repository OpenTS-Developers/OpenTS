name: Engine build

# The engine build itself, called by the workflows that decide when to run it.
on:
  workflow_call:
    inputs:
      artifact-prefix:
        description: "Prefix for the uploaded artifact names."
        required: true
        type: string
      artifact-retention-days:
        description: "How long to keep the uploaded artifacts."
        required: false
        default: 90
        type: number
      configurations:
        description: "JSON array of build configurations."
        required: false
        default: '["Debug", "Release"]'
        type: string
      official:
        description: "Configure an official build, which reports the version it declares without a commit."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.configuration }}
    # The runner image has to carry the Visual Studio 2022 toolchain that docs/BUILDING.md
    # names as the supported one. windows-2025 and windows-latest resolve to an image built
    # around Visual Studio 2026 and have no 2022 instance for the generator to find, so they
    # are not interchangeable here. Moving to a newer toolchain is a change to the supported
    # build, not to this workflow.
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        configuration: ${{ fromJSON(inputs.configurations) }}
    steps:
      - name: Check out OpenTS
        # The build stamp needs no history: it reads the commit, the refs that point at it,
        # and the worktree state, all of which a shallow checkout answers.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Report the short commit
        id: commit
        shell: bash
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Annotate compiler diagnostics
        shell: bash
        run: echo "::add-matcher::.github/msvc-problem-matcher.json"

      # TS_RUN_DIR receives the build's runtime files, and defaults to a game installation.
      # An empty directory holds this build's output and none of the game's own files.
      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A Win32
          -DTS_RUN_DIR=${{ github.workspace }}/artifact
          -DOPENTS_OFFICIAL_BUILD=${{ inputs.official && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config ${{ matrix.configuration }}

      - name: Test
        run: ctest --test-dir build -C ${{ matrix.configuration }} --output-on-failure

      - name: Stage license notices
        shell: bash
        run: |
          cp LICENSE.md THIRD_PARTY_NOTICES.md artifact/
          mkdir -p artifact/OpenTS_THIRD_PARTY_LICENSES
          cp thirdparty/bgfx.cmake/bgfx/LICENSE artifact/OpenTS_THIRD_PARTY_LICENSES/bgfx.txt
          cp thirdparty/bgfx.cmake/bx/LICENSE artifact/OpenTS_THIRD_PARTY_LICENSES/bx.txt
          cp thirdparty/bgfx.cmake/bimg/LICENSE artifact/OpenTS_THIRD_PARTY_LICENSES/bimg.txt
          cp thirdparty/bgfx.cmake/bgfx/3rdparty/directx-headers/LICENSE artifact/OpenTS_THIRD_PARTY_LICENSES/directx-headers.txt
          cp thirdparty/bgfx.cmake/bx/include/tinystl/LICENSE artifact/OpenTS_THIRD_PARTY_LICENSES/tinystl.txt
          cp thirdparty/bgfx.cmake/bimg/3rdparty/astc-encoder/LICENSE.txt artifact/OpenTS_THIRD_PARTY_LICENSES/astc-encoder.txt
          cp thirdparty/libbase64/LICENSE artifact/OpenTS_THIRD_PARTY_LICENSES/libbase64.txt
          cp thirdparty/licenses/khronos-opengl.txt artifact/OpenTS_THIRD_PARTY_LICENSES/khronos-opengl.txt
          cat thirdparty/licenses/khronos-vulkan-notice.txt \
              thirdparty/bgfx.cmake/bimg/3rdparty/astc-encoder/LICENSE.txt \
              > artifact/OpenTS_THIRD_PARTY_LICENSES/khronos-vulkan.txt

      - name: Upload runtime files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ inputs.artifact-prefix }}-${{ matrix.configuration }}-${{ steps.commit.outputs.short }}
          # The symbol file answers everything the linker map would, and is what the crash
          # handler itself reads, so a downloaded build has no use for the map.
          path: |
            artifact
            !artifact/*.map
          if-no-files-found: error
          retention-days: ${{ inputs.artifact-retention-days }}
