name: Engine nightly

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-nightly
  cancel-in-progress: false

jobs:
  activity:
    name: Check for new commits
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
    steps:
      # The public nightly link resolves to the latest successful scheduled run, so a
      # scheduled run with no new commits cancels itself instead of succeeding without
      # artifacts. A run started by hand always builds.
      - name: Cancel the run when nothing new landed
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          committed="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_REF_NAME}" \
            --jq '.commit.committer.date')"
          age=$(( $(date --utc +%s) - $(date --utc -d "${committed}" +%s) ))
          echo "Last commit ${committed}, $(( age / 3600 ))h ago."
          # 90000 seconds is 25 hours, so a run that starts late still counts the
          # previous day's commits.
          if [ "${age}" -ge 90000 ]; then
            echo "Nothing new since the last nightly; cancelling this run."
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/cancel"
            # Hold the job open until the cancellation lands; failing is the
            # fallback so a no-op run never concludes successful.
            sleep 300
            exit 1
          fi

  build:
    name: Build
    needs: activity
    uses: ./.github/workflows/engine-build.yml
    with:
      artifact-prefix: opents-nightly
