name: Engine build comment

# Follows a successful pull-request build of the Engine workflow and keeps one
# comment on the pull request pointing at direct downloads of its artifacts.
# Running from workflow_run gives the job a repository-scoped token, so the
# comment also lands on pull requests from forks.
on:
  workflow_run:
    workflows: [Engine]
    types: [completed]

permissions:
  pull-requests: write
  actions: read

jobs:
  comment:
    name: Link the build on the pull request
    if: >
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Post or update the download comment
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          marker="<!-- bot: opents-build-links -->"

          # The run's own pull_requests list is empty for fork branches, so
          # find the pull request by its current head commit instead. A run
          # whose commit is no longer the head of an open pull request that
          # is ready for review is stale, or belongs to a draft; the newer
          # push, or marking the draft ready, has its own run and comment.
          number="$(gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --paginate --jq ".[] | select(.head.sha == \"${HEAD_SHA}\" and .draft == false) | .number" | head -n 1)"
          if [ -z "${number}" ]; then
            echo "No open pull request ready for review at ${HEAD_SHA}; skipping."
            exit 0
          fi

          {
            echo "${marker}"
            echo "Development builds of ${HEAD_SHA:0:7}:"
            echo
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
              --jq '.artifacts[] | "- [\(.name)](https://nightly.link/'"${GITHUB_REPOSITORY}"'/actions/runs/'"${RUN_ID}"'/\(.name).zip)"'
            echo
            echo "The links work without a GitHub account. Artifacts expire after 90 days, and this comment follows the latest successful build."
          } > comment.md

          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" \
            --paginate --jq ".[] | select(.body | startswith(\"${marker}\")) | .id" | head -n 1)"
          if [ -n "${existing}" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F body=@comment.md > /dev/null
            echo "Updated comment ${existing} on #${number}."
          else
            gh api --method POST "repos/${GITHUB_REPOSITORY}/issues/${number}/comments" \
              -F body=@comment.md > /dev/null
            echo "Commented on #${number}."
          fi
