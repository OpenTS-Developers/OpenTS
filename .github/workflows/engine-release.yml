name: Engine release

# Builds the two release clients and attaches them to a GitHub release.
# The release procedure around this workflow is documented in
# manual/MAINTAINING.md. It does not edit the release notes.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the zips to
        required: true
        type: string

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    # windows-2025 and windows-latest carry Visual Studio 2026 and have no 2022
    # instance for this generator to find.
    runs-on: windows-2022
    steps:
      - name: Check out OpenTS
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Annotate compiler diagnostics
        shell: bash
        run: echo "::add-matcher::.github/msvc-problem-matcher.json"

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DOPENTS_OFFICIAL_BUILD=ON
          -DOPENTS_DESKTOP_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage the client
        shell: bash
        run: |
          mkdir -p artifact
          built=build/bin/Release
          cp "${built}/Game.exe" "${built}/Game.pdb" "${built}/Language.dll" artifact/
          cp -r "${built}/ui" artifact/ui
          bash .github/scripts/stage-notices.sh artifact

      - name: Upload the client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: artifact
          if-no-files-found: error

  macos:
    name: macOS arm64
    # macos-latest is an Apple Silicon runner. The client is arm64.
    runs-on: macos-latest
    steps:
      - name: Check out OpenTS
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build/macos -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENTS_OFFICIAL_BUILD=ON

      - name: Build
        run: cmake --build build/macos

      - name: Stage the client
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          version=$(sed -n 's/^project(OpenTS VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test -n "$version"
          bash .github/scripts/package-macos-release.sh \
            build/macos/bin/Game \
            build/macos/bin/ui \
            code/resources/app-icon/siliconsun.png \
            "$version" \
            artifact \
            "${GITHUB_WORKSPACE}/siliconsun-macos.zip"

      - name: Upload the client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64
          path: siliconsun-macos.zip
          if-no-files-found: error

  package:
    name: Attach the packaged build
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Download the clients
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifact

      - name: Package the release zips
        run: |
          set -euo pipefail
          win=artifact/windows-x64
          # Steam and the retail install launch SUN.EXE. Game.pdb keeps its name
          # because that is the symbol file the linker records.
          mv "${win}/Game.exe" "${win}/SUN.EXE"
          ( cd "${win}" && zip -r "${GITHUB_WORKSPACE}/siliconsun-${TAG}-x64.zip" \
              SUN.EXE Game.pdb Language.dll ui \
              LICENSE.md THIRD_PARTY_NOTICES.md OpenTS_THIRD_PARTY_LICENSES )
          # The macOS job already zipped the application bundle.
          mac_zip=artifact/macos-arm64/siliconsun-macos.zip
          test -f "${mac_zip}"
          cp "${mac_zip}" "${GITHUB_WORKSPACE}/siliconsun-${TAG}-macos.zip"

      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" siliconsun-"$TAG"-*.zip --clobber --repo "$GITHUB_REPOSITORY"
