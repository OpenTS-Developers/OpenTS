name: Engine release

# Builds the two release clients and attaches them to a published GitHub
# release. The release procedure around this workflow is documented in
# manual/MAINTAINING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    # windows-2025 and windows-latest carry Visual Studio 2026 and have no 2022
    # instance for this generator to find.
    runs-on: windows-2022
    steps:
      - name: Check out OpenTS
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Annotate compiler diagnostics
        shell: bash
        run: echo "::add-matcher::.github/msvc-problem-matcher.json"

      - name: Configure
        run: >
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64
          -DOPENTS_OFFICIAL_BUILD=ON
          -DOPENTS_DESKTOP_TESTS=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage the client
        shell: bash
        run: |
          mkdir -p artifact
          built=build/bin/Release
          cp "${built}/Game.exe" "${built}/Game.pdb" "${built}/Language.dll" artifact/
          cp -r "${built}/ui" artifact/ui
          bash .github/scripts/stage-notices.sh artifact

      - name: Upload the client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-x64
          path: artifact
          if-no-files-found: error

  macos:
    name: macOS arm64
    # macos-latest is an Apple Silicon runner. The client is arm64.
    runs-on: macos-latest
    steps:
      - name: Check out OpenTS
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          submodules: recursive

      - name: Install Ninja
        run: brew install ninja

      - name: Configure
        run: >
          cmake -S . -B build/macos -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DOPENTS_OFFICIAL_BUILD=ON

      - name: Build
        run: cmake --build build/macos

      - name: Stage the client
        run: |
          mkdir -p artifact
          built=build/macos/bin
          cp "${built}/Game" artifact/
          cp -r "${built}/ui" artifact/ui
          bash .github/scripts/stage-notices.sh artifact

      - name: Upload the client
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: macos-arm64
          path: artifact
          if-no-files-found: error

  package:
    name: Attach the packaged build
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download the clients
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifact

      - name: Package the release zips
        run: |
          set -euo pipefail
          win=artifact/windows-x64
          mac=artifact/macos-arm64
          # Steam and the retail install launch SUN.EXE. Game.pdb keeps its name
          # because that is the symbol file the linker records.
          mv "${win}/Game.exe" "${win}/SUN.EXE"
          ( cd "${win}" && zip -r "${GITHUB_WORKSPACE}/siliconsun-${TAG}-x64.zip" \
              SUN.EXE Game.pdb Language.dll ui \
              LICENSE.md THIRD_PARTY_NOTICES.md OpenTS_THIRD_PARTY_LICENSES )
          chmod +x "${mac}/Game"
          ( cd "${mac}" && zip -r "${GITHUB_WORKSPACE}/siliconsun-${TAG}-macos.zip" \
              Game ui \
              LICENSE.md THIRD_PARTY_NOTICES.md OpenTS_THIRD_PARTY_LICENSES )

      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" siliconsun-"$TAG"-*.zip --clobber --repo "$GITHUB_REPOSITORY"

  notes:
    name: Append generated release notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out OpenTS
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: manual/tools/.python-version
          cache: pip
          cache-dependency-path: manual/tools/requirements.txt

      - name: Install manual tooling dependencies
        run: python -m pip install --disable-pip-version-check -r manual/tools/requirements.txt

      - name: Generate the notes from the release's change records
        run: python manual/tools/manage.py release-notes "${TAG#v}" > generated-notes.md

      # A marker block keeps the run repeatable: a rerun replaces the generated
      # notes and leaves the release author's own text alone.
      - name: Append the notes to the release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json body --jq .body > body.md
          python - <<'PY'
          from pathlib import Path

          START = "<!-- opents-release-notes start -->"
          END = "<!-- opents-release-notes end -->"
          body = Path("body.md").read_text(encoding="utf-8")
          if START in body and END in body:
              head, rest = body.split(START, 1)
              _, tail = rest.split(END, 1)
              body = head.rstrip() + tail
          notes = Path("generated-notes.md").read_text(encoding="utf-8").strip()
          block = f"{START}\n{notes}\n{END}\n"
          body = f"{body.rstrip()}\n\n{block}" if body.strip() else block
          Path("body.md").write_text(body, encoding="utf-8")
          PY
          gh release edit "$TAG" --notes-file body.md
