name: Engine release

# Attaches the packaged build and generated notes to a published GitHub
# release. The release procedure around this workflow is documented in
# manual/MAINTAINING.md.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  preflight:
    name: Check the release
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.release.tag_name }}
    outputs:
      label: ${{ steps.tag.outputs.label }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Check out OpenTS
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: manual/tools/.python-version
          cache: pip
          cache-dependency-path: manual/tools/requirements.txt

      - name: Install manual tooling dependencies
        run: python -m pip install --disable-pip-version-check -r manual/tools/requirements.txt

      - name: Check the tag and the release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # A rerun builds the commit the run started for, even after the tag moves.
          tagged="$(git rev-parse --verify --quiet "refs/tags/${TAG}^{commit}" || true)"
          if [ "${tagged}" != "${GITHUB_SHA}" ]; then
            fail "${TAG} has moved since this run started. Delete the release and the tag, tag the right commit, and publish a new release."
          fi

          [[ "${TAG}" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-([0-9A-Za-z.-]+))?$ ]] \
            || fail "${TAG} is not v<major>.<minor>.<patch>, optionally followed by -<label>."
          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          core="${major}.${minor}.${BASH_REMATCH[3]}"
          label="${BASH_REMATCH[5]}"

          declared="$(sed -nE 's/^project\(OpenTS VERSION ([0-9.]+).*/\1/p' CMakeLists.txt)"
          [ "${declared}" = "${core}" ] \
            || fail "${TAG} names ${core}, but CMakeLists.txt at the tag declares ${declared}."

          prerelease="$(gh release view "${TAG}" --json isPrerelease --jq .isPrerelease)"
          if [ -n "${label}" ] && [ "${prerelease}" != "true" ]; then
            fail "${TAG} has a label, so mark the release as a pre-release and rerun this workflow."
          fi
          if [ -z "${label}" ] && [ "${prerelease}" != "false" ]; then
            fail "${TAG} is a final release, so clear the pre-release mark and rerun this workflow."
          fi

          for other in $(git tag --list 'v*'); do
            if [[ "${other}" =~ ^v([0-9]+)\.([0-9]+)\. ]] \
                && (( BASH_REMATCH[1] > major
                      || (BASH_REMATCH[1] == major && BASH_REMATCH[2] > minor) )); then
              fail "${other} exists, so ${major}.${minor} receives no further releases."
            fi
          done

          branch="release/${major}.${minor}"
          git rev-parse --verify --quiet "refs/remotes/origin/${branch}" > /dev/null \
            || fail "${branch} does not exist. Tag a commit on that branch."
          git merge-base --is-ancestor "${GITHUB_SHA}" "refs/remotes/origin/${branch}" \
            || fail "${TAG} is not on ${branch}. Tag a commit on that branch."

          python manual/tools/manage.py release-notes "${core}" --tag "${TAG}" > generated-notes.md

          echo "label=${label}" >> "${GITHUB_OUTPUT}"
          echo "version=${core}${label:+-${label}}" >> "${GITHUB_OUTPUT}"

      - name: Keep the generated notes
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-notes
          path: generated-notes.md
          if-no-files-found: error

  build:
    name: Build
    needs: preflight
    uses: ./.github/workflows/engine-build.yml
    with:
      artifact-prefix: opents-release
      configurations: '["Release"]'
      official: true
      version-label: ${{ needs.preflight.outputs.label }}
      expected-version: ${{ needs.preflight.outputs.version }}

  package:
    name: Attach the packaged build
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download the build artifacts
        # Each platform keeps its own directory here. Merging them would put two
        # different Game.exe files in one place.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: opents-release-*-Release-*
          path: artifact

      - name: Package a release zip for each platform
        run: |
          for dir in artifact/opents-release-*-Release-*; do
            # Artifacts are named <prefix>-<platform>-<configuration>-<commit>, and the
            # prefix itself contains a hyphen, so count the fields from the end.
            platform="$(basename "${dir}" | awk -F- '{print $(NF-2)}')"
            ( cd "${dir}" && zip -r "${GITHUB_WORKSPACE}/OpenTS-${TAG}-${platform}.zip" \
                Game.exe Game.pdb Language.dll ui \
                LICENSE.md THIRD_PARTY_NOTICES.md OpenTS_THIRD_PARTY_LICENSES )
          done

      - name: Attach the zips to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" OpenTS-"$TAG"-*.zip --clobber --repo "$GITHUB_REPOSITORY"

  notes:
    name: Append generated release notes
    needs: preflight
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Download the generated notes
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-notes

      # A marker block keeps the run repeatable: a rerun replaces the generated
      # notes and leaves the release author's own text alone.
      - name: Append the notes to the release body
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --json body --jq .body --repo "$GITHUB_REPOSITORY" > body.md
          python3 - <<'PY'
          from pathlib import Path

          START = "<!-- opents-release-notes start -->"
          END = "<!-- opents-release-notes end -->"
          body = Path("body.md").read_text(encoding="utf-8")
          if START in body and END in body:
              head, rest = body.split(START, 1)
              _, tail = rest.split(END, 1)
              body = head.rstrip() + tail
          notes = Path("generated-notes.md").read_text(encoding="utf-8").strip()
          block = f"{START}\n{notes}\n{END}\n"
          body = f"{body.rstrip()}\n\n{block}" if body.strip() else block
          Path("body.md").write_text(body, encoding="utf-8")
          PY
          gh release edit "$TAG" --notes-file body.md --repo "$GITHUB_REPOSITORY"
