name: Engine

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "code/**"
      - "cmake/**"
      - "tests/**"
      - "thirdparty/**"
      - "ui/**"
      - "CMakeLists.txt"
      - ".gitmodules"
      - ".github/msvc-problem-matcher.json"
      - ".github/workflows/engine.yml"
      - ".github/workflows/engine-build.yml"
  push:
    branches: [main]
    paths:
      - "code/**"
      - "cmake/**"
      - "tests/**"
      - "thirdparty/**"
      - "ui/**"
      - "CMakeLists.txt"
      - ".gitmodules"
      - ".github/msvc-problem-matcher.json"
      - ".github/workflows/engine.yml"
      - ".github/workflows/engine-build.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    # A draft pull request builds nothing; the ready_for_review trigger above
    # starts the build when the pull request is marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    uses: ./.github/workflows/engine-build.yml
    with:
      artifact-prefix: opents
