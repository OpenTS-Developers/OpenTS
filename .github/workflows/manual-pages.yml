name: Manual

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "manual/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "LICENSE.md"
      - "docs/**"
      - "code/**"
      - "CMakeLists.txt"
      - ".github/workflows/manual-pages.yml"
  push:
    branches: [main, "release/**"]
    paths:
      - "manual/**"
      - "README.md"
      - "CONTRIBUTING.md"
      - "AGENTS.md"
      - "LICENSE.md"
      - "docs/**"
      - "code/**"
      - "CMakeLists.txt"
      - ".github/workflows/manual-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and build manual
    # A draft pull request validates nothing; the ready_for_review trigger above
    # starts the check when the pull request is marked ready.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    concurrency:
      group: manual-validation-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    env:
      DOCS_SITE: https://${{ github.repository_owner }}.github.io
      DOCS_BASE: /${{ github.event.repository.name }}
      DOCS_REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
      DOCS_REVISION: ${{ github.sha }}
    steps:
      - name: Check out OpenTS
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version-file: manual/tools/.python-version
          cache: pip
          cache-dependency-path: manual/tools/requirements.txt

      - name: Install extraction dependencies
        run: python -m pip install --disable-pip-version-check -r manual/tools/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: manual/site/.nvmrc
          cache: npm
          cache-dependency-path: manual/site/package-lock.json

      - name: Pin npm
        shell: bash
        run: |
          npm_version="$(node -p "require('./manual/site/package.json').packageManager.split('@').at(-1)")"
          npm install --global "npm@${npm_version}"

      - name: Verify JavaScript toolchain
        shell: bash
        run: |
          test "$(node --version)" = "v$(tr -d '\r\n' < manual/site/.nvmrc)"
          test "$(npm --version)" = "$(node -p "require('./manual/site/package.json').packageManager.split('@').at(-1)")"

      - name: Install locked site dependencies
        run: npm ci
        working-directory: manual/site

      - name: Run complete manual check against pull-request target
        if: github.event_name == 'pull_request'
        run: python manual/tools/manage.py check --base-ref ${{ github.event.pull_request.base.sha }}

      # A branch creation has no pre-push revision, and a force-push names one
      # that the rewritten history no longer contains. Both compare against the
      # point where the branch left main, which is HEAD itself on main.
      - name: Run complete manual check for a push
        if: github.event_name == 'push'
        shell: bash
        run: |
          base="${{ github.event.before }}"
          if [ "$base" = "0000000000000000000000000000000000000000" ] \
              || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git merge-base HEAD origin/main)"
            echo "Pre-push revision unavailable; comparing against ${base}."
          fi
          python manual/tools/manage.py check --base-ref "$base"

      - name: Run complete manual check
        if: github.event_name == 'workflow_dispatch'
        run: python manual/tools/manage.py check

      - name: Install production site dependencies
        run: npm ci --omit=dev
        working-directory: manual/site

      - name: Build publish artifact from production dependencies
        run: npm run build
        working-directory: manual/site

      - name: Verify publish artifact
        shell: bash
        run: |
          npm run check:render
          npm run check:search
          npm run check:links
        working-directory: manual/site

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: manual/site/dist

  deploy:
    name: Deploy manual to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate-and-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
