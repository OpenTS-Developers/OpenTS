# Curated adjudications for multi-meaning INI keys (hand-owned; the extractor
# merges this file into its output, so verdicts survive regeneration).
#
# A key whose scopes have DIFFERENT backing members is mechanically flagged
# needs_review: the extractor cannot know whether the scopes are genuinely
# different settings that share a name, or one setting it failed to unify.
# This file records the human answer, scope by scope.
#
# Format:
#   <Key>:
#     "<DeclaringClass>::<member>":   # the scope's stable identity, from _provenance
#       verdict: distinct             # a separate setting that shares the name
#       absorbs: ["<Class>::<member>"]  # scopes that are really the SAME read
#                                       # (a staging local, a copy-paste double
#                                       # read) -- folded into this scope
#       specializes: "<Class>::<member>" # this derived same-file/same-section
#                                       # meaning replaces the broader scope for
#                                       # its narrower applicability
#       note: ...                     # parse-level fact worth publishing
#
# Every scope of a flagged key must be listed for the key to clear review;
# a scope left unlisted stays needs_review, so a NEW collision introduced by
# a later extraction surfaces here on its own. The extractor warns on entries
# that no longer match the extraction (stale adjudications must be looked at,
# never silently dropped).
#
# Notes are data, not prose: they state what the engine PARSES (double reads,
# fallback order, an unusual default source). What a setting DOES belongs in
# the authored page.

