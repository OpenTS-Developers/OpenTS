launch_options:
  - id: launch:help
    title: Command-line help
    syntax: "-?"
    aliases: ["/?", "-h", "/h"]
    description: Shows the original game's parameter summary and exits without starting the game.
    group: startup
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-?' }
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:/?' }
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-h' }
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:/h' }
  - id: launch:playtest
    title: Playtest mode
    syntax: PLAYTEST
    description: Arms the debug keys, which any command-line argument already does.
    group: debug-build
    availability: *debug
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'obfuscated:PARM_PLAYTEST', guard: _DEBUG }
  - id: launch:from-install
    title: Installer launch
    syntax: FROMINSTALL
    description: Plays the `EVA.VQA` introduction movie before the startup movies, whatever `PlayIntro` says.
    group: startup
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'obfuscated:PARM_INSTALL' }
  - id: launch:check-map
    title: Map checking
    syntax: -CHECKMAP
    description: Runs a map check every frame, which examines nothing and always passes.
    group: debug-build
    availability: *debug
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-CHECKMAP', guard: _DEBUG }
  - id: launch:data-directory
    title: Game data directory
    syntax: -DATADIR=<path>
    description: Reads the game's data from the directory named, and never writes there.
    group: files-display
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-DATADIR=' }
  - id: launch:user-directory
    title: User data directory
    syntax: -USERDIR=<path>
    description: Writes settings, saved games and the other files the game creates into the directory named, and creates the directory when it is missing.
    group: files-display
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-USERDIR=' }
  - id: launch:spawn
    title: Client launch
    syntax: -SPAWN
    description: Plays the match `SPAWN.INI` describes in place of the startup movies and the menu, and exits when the match ends.
    group: multiplayer
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-SPAWN' }
  - id: launch:capture-map
    title: Map capture
    syntax: -CAPTUREMAP=<map>
    description: Draws the map named to a PNG picture with the default capture settings, then exits without having shown a window, a console or a dialog.
    group: map-capture
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-CAPTUREMAP=' }
  - id: launch:capture-output
    title: Map capture file
    syntax: -CAPTUREOUT=<path>
    description: Names the PNG file a `-CAPTUREMAP=` capture writes, replacing any file already there.
    group: map-capture
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-CAPTUREOUT=' }
  - id: launch:capture
    title: Map capture description
    syntax: -CAPTURE=<file>
    description: Makes the map capture the file describes, then exits without having shown a window, a console or a dialog.
    group: map-capture
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-CAPTURE=' }
  - id: launch:tournament-time
    title: Tournament time limit
    syntax: -TIME=<minutes>
    description: Ends a network match after the number of game minutes given, and decides by score whether this player wins.
    group: multiplayer
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-TIME=' }
  - id: launch:multiplayer-debug
    title: Internet debug display
    syntax: -MPDEBUG
    description: Shows network statistics along the bottom of the screen in any game but a campaign mission.
    group: multiplayer
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-MPDEBUG' }
  - id: launch:stealth
    title: Network stealth mode
    syntax: -STEALTH
    description: Has no effect. It was meant to keep this copy out of other players' LAN game lists.
    group: multiplayer
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-STEALTH' }
  - id: launch:attract
    title: Attract mode
    syntax: -ATTRACT
    description: Lets any key press end a `-XY` playback before the playback writes its report, and has no other effect.
    group: startup
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-ATTRACT' }
  - id: launch:resolution
    title: Resolution
    syntax: -<width>X<height>
    description: Sets the screen size, such as `-1280X720`, for a dimension `sun.ini` leaves out.
    group: files-display
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'pattern:-<width>X<height>' }
  - id: launch:windowed
    title: Windowed mode
    syntax: -WIN
    description: Opens the game in a window for this run, whatever `Fullscreen` says.
    group: files-display
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-WIN' }
  - id: launch:multiple-instances
    title: Multiple copies
    syntax: -MULTIINSTANCE
    description: Lets this copy start while another copy of the game is running.
    group: testing
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-MULTIINSTANCE' }
  - id: launch:exception-test
    title: Exception reporting test
    syntax: -EXCEPTIONTEST=<fault>
    description: Raises the fault named on purpose, so that crash reporting can be checked without waiting for a real crash.
    group: testing
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-EXCEPTIONTEST=' }
  - id: launch:desync-test
    title: Out-of-sync test
    syntax: -DESYNCTEST=<frame>
    description: Corrupts this machine's game checksum once, from the frame given, so that the out-of-sync report can be checked without waiting for a real divergence.
    group: testing
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-DESYNCTEST=' }
  - id: launch:seed
    title: Random seed
    syntax: -SEED<number>
    description: Seeds the random number generator for a campaign mission or skirmish started from the menu, so that it repeats the same random draws each time.
    group: debug-build
    availability: *debug
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-SEED', guard: _DEBUG }
  - id: launch:monochrome
    title: Monochrome debug display
    syntax: -XM
    description: Enables the monochrome debug pages, which the monochrome debug key then switches on and off.
    group: debug-build
    availability: *debug
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'compact:-XM', guard: _DEBUG }
  - id: launch:inert
    title: Inert weapons
    syntax: -XI
    description: Makes weapons deal no damage, as `Inert=yes` does, in any game but a campaign mission.
    group: debug-build
    availability: *debug
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'compact:-XI', guard: _DEBUG }
  - id: launch:speed-build
    title: Instant superweapon charge
    syntax: -XH
    description: Makes a superweapon finish charging one frame after it starts.
    group: debug-build
    availability: *debug
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'compact:-XH', guard: _DEBUG }
  - id: launch:record
    title: Game recording
    syntax: -XX
    description: Records each game to `RECORD.BIN`, campaign missions included.
    group: debug-build
    availability: *debug
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'compact:-XX', guard: _DEBUG }
  - id: launch:playback
    title: Recording playback
    syntax: -XY
    description: Plays back `RECORD.BIN` in place of the main menu, but the playback writes an out-of-sync report and exits on its first frame.
    group: debug-build
    availability: *debug
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'compact:-XY', guard: _DEBUG }
  - id: launch:console-debug
    title: Console debug output
    syntax: -XC
    description: Opens the debug console in a Release build. A Debug build opens it without this option, except during a map capture.
    group: testing
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'compact:-XC' }
  - id: launch:event-debug
    title: Event and packet debug
    syntax: -XP
    description: Writes the orders packed into each outgoing network packet, and each player's departure, to the debug log.
    group: debug-build
    availability: *debug
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'compact:-XP', guard: _DEBUG }
  - id: launch:quiet
    title: Quiet mode
    syntax: -XQ
    description: Mutes music, sound effects and EVA speech.
    group: testing
    availability: *all
    sites:
      - { file: code/init.cpp, function: Parse_Command_Line, expression: 'compact:-XQ' }

launch_exclusions:
  - site: { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-O' }
    reason: Supplies the comparison length for the -X branch and is not itself accepted.
  - site: { file: code/init.cpp, function: Parse_Command_Line, expression: 'literal:-X' }
    reason: Container for the individually documented compact -X controls; it has no behavior without a following code.
