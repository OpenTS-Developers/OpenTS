trigger_actions:
- id: TACTION_NONE
  kind: trigger-action
  index: 0
  editor_name: -No Action-
  editor_description: This is a null action. It will do nothing and is equivalent to not having an action
    at all. Why use it?
  need: NEED_NONE
  parameters: []
  ini_example:
    section: '[Actions]'
    line: <TriggerID>=1,0,0,0,0,0,0,0,
  attaches_to: null
  status: generated
- id: TACTION_WIN
  kind: trigger-action
  index: 1
  editor_name: Winner is...
  editor_description: The winner will be forced to be the house specified. The game will end immediately.
    Typically, the player's house is specified.
  need: NEED_HOUSE
  parameters:
  - name: House
    type: house
  ini_example:
    section: '[Actions]'
    line: <TriggerID>=1,1,0,<House>,0,0,0,0,
  attaches_to: null
  status: generated
- id: TACTION_LOSE
