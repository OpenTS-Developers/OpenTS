# Removed settings live here only after source history establishes their removal.
# They remain searchable and directly addressable, but active indexes omit them.
- type: command
  id: fixed:cancel-modem-operation
  route: /commands/fixed-cancel-modem-operation/
  search_aliases:
    - Cancel modem operation
  summary: Cancelled a dial, answer, or modem-command wait. Removed with modem and null-modem play.
- type: command
  id: launch:cd-path
  route: /using/command-line/cd-path/
  search_aliases:
    - Local data path
    - -CD
  summary: Added the path following -CD to the local file-search list. Replaced by the game data directory and the deployment's own search folders.
  replacement:
    type: command
    id: launch:data-directory
- type: key
  id: ModemName
  route: /keys/modemname/
  search_aliases:
    - ModemName
  summary: Named the modem the serial connection used. Removed with modem and null-modem play.
- type: key
  id: Port
  route: /keys/port/
  search_aliases:
    - Port
  summary: Set the serial port address the modem answered on. Removed with modem and null-modem play.
- type: key
  id: IRQ
  route: /keys/irq/
  search_aliases:
    - IRQ
  summary: Set the interrupt the serial port used. Removed with modem and null-modem play.
- type: key
  id: Baud
  route: /keys/baud/
  search_aliases:
    - Baud
  summary: Set the speed of the serial connection. Removed with modem and null-modem play.
- type: key
  id: Compression
  route: /keys/compression/
  search_aliases:
    - Compression
  summary: Switched modem data compression on. Removed with modem and null-modem play.
- type: key
  id: ErrorCorrection
  route: /keys/errorcorrection/
  search_aliases:
    - ErrorCorrection
  summary: Switched modem error correction on. Removed with modem and null-modem play.
- type: key
  id: DialMethod
  route: /keys/dialmethod/
  search_aliases:
    - DialMethod
  summary: Chose tone or pulse dialing. Removed with modem and null-modem play.
- type: key
  id: InitStringIndex
  route: /keys/initstringindex/
  search_aliases:
    - InitStringIndex
  summary: Picked which stored initialization string the modem was sent. Removed with modem and null-modem play.
- type: key
  id: CallWaitStringIndex
  route: /keys/callwaitstringindex/
  search_aliases:
    - CallWaitStringIndex
  summary: Picked which call-waiting prefix was dialed. Removed with modem and null-modem play.
- type: key
  id: CallWaitString
  route: /keys/callwaitstring/
  search_aliases:
    - CallWaitString
  summary: Held the custom call-waiting prefix. Removed with modem and null-modem play.
- type: key
  id: PhoneIndex
  route: /keys/phoneindex/
  search_aliases:
    - PhoneIndex
  summary: Remembered the last phone book entry dialed. Removed with modem and null-modem play.
- type: key
  id: Socket
  route: /keys/socket/
  search_aliases:
    - Socket
  summary: Chose the IPX socket the game communicated over. Removed with IPX network play.
- type: key
  id: NetCard
  route: /keys/netcard/
  search_aliases:
    - NetCard
  summary: Chose which network adapter an IPX game played over. Removed with IPX network play.
- type: key
  id: DestNet
  route: /keys/destnet/
  search_aliases:
    - DestNet
  summary: Named a network across a bridge for IPX broadcasts to reach. Removed with IPX network play.
- type: command
  id: launch:destination-network
  route: /using/command-line/destination-network/
  search_aliases:
    - -DESTNET
    - IPX destination network
  summary: Set the IPX bridge destination network at launch. Removed with IPX network play.
- type: command
  id: launch:socket
  route: /using/command-line/socket/
  search_aliases:
    - -SOCKET
    - IPX socket offset
  summary: Selected an IPX socket offset at launch. Removed with IPX network play.
- type: key
  id: VideoBackBuffer
  route: /keys/videobackbuffer/
  search_aliases:
    - VideoBackBuffer
  summary: Stored a back buffer preference that nothing read. Removed with DirectDraw.
- type: key
  id: AllowHiResModes
  route: /keys/allowhiresmodes/
  search_aliases:
    - AllowHiResModes
  summary: Allowed resolutions above 800 pixels wide to be offered. Removed when the display options screen began offering every resolution the display reports.
- type: key
  id: AllowModeToggle
  route: /keys/allowmodetoggle/
  search_aliases:
    - AllowModeToggle
  summary: Switched resolution between the menus and play. Removed when the picture began being scaled into the window instead.
- type: command
  id: launch:high-color
  route: /using/command-line/high-color/
  search_aliases:
    - "-16"
    - High color
  summary: Set a high-color flag at launch. Removed when it lost its last reader; the game always renders in high color.
- type: command
  id: launch:no-exception-trap
  route: /using/command-line/no-exception-trap/
  search_aliases:
    - "-XE"
    - Disable exception trap
  summary: Left a crash to the debugger instead of the engine's own handler. Removed because a debugger now takes a crash first without being asked.
